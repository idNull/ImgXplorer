      <path d="M50 570 V380 H140 V300 H230 V420 H300 V250 H390 V360 H470 V280 H560 V430 H650 V330 H720 V220 H800 V390 H880 V310 H980 V440 H1060 V350 H1150 V570 Z" fill="#0b1026"/>
