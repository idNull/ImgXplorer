    <path d="M120 660 H500 Q530 660 530 690 V770 Q530 800 500 800 H330 L285 850 L295 800 H120 Q90 800 90 770 V690 Q90 660 120 660 Z" fill="#fff" stroke="#111" stroke-width="5"/>
