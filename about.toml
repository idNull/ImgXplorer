# Configuración de cargo-about para la lista de licencias de terceros (pnpm third-party).
# Solo se aceptan licencias compatibles con la MIT del proyecto: si una dependencia nueva trae
# otra (GPL, por ejemplo), la generación falla y hay que decidir qué hacer con ella.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "NCSA",
    "bzip2-1.0.6",
    # Lista de certificados de Mozilla (webpki-roots), para las conexiones seguras de las voces con IA.
    "CDLA-Permissive-2.0",
]

# Lo que va dentro del ejecutable de Linux y de Mac.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"]

ignore-build-dependencies = false
ignore-dev-dependencies = true
