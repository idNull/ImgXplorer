[package]
name = "imgxplorer-mobile"
description = "imgxplorer para el móvil: visor de cómics, imágenes e historias .imgxstory"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
# staticlib para iOS, cdylib para Android y rlib para probarla como ventana en el ordenador.
name = "imgxplorer_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
imgx-host.workspace = true
# Sin libheif (en el móvil el HEIC lo convierte el sistema al importarlo) y con UnRAR para .cbr.
imgx-media = { workspace = true, features = ["rar"] }
imgx-story.workspace = true
log = "0.4"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-imgx-mobile = { path = "../plugin" }
tauri-plugin-log = "2"

[dev-dependencies]
imgx-core.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
