[workspace]
resolver = "3"
members = ["crates/imgx-core", "crates/imgx-media", "crates/imgx-audio", "crates/imgx-story", "crates/imgx-wasm", "crates/imgx-host", "src-tauri", "mobile/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
imgx-audio = { path = "crates/imgx-audio" }
imgx-core = { path = "crates/imgx-core" }
imgx-host = { path = "crates/imgx-host" }
imgx-media = { path = "crates/imgx-media", default-features = false }
imgx-story = { path = "crates/imgx-story" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.release.package.imgx-wasm]
opt-level = "s"

# En desarrollo, dependencias optimizadas: decodificar imágenes sin optimizar es 10–30× más lento.
[profile.dev.package."*"]
opt-level = 2

# El motor de sonido mezcla en tiempo real: sin optimizar, una mezcla cargada de efectos gasta
# 6× más procesador y podría entrecortarse.
[profile.dev.package.imgx-audio]
opt-level = 2
