[package]
name = "imgx-media"
description = "Fuentes de imágenes (carpetas y comprimidos), decodificación y caché."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "tga", "ico", "qoi", "exr", "hdr", "pnm", "dds", "rayon"] }
jxl-oxide = { version = "0.12", features = ["image"] }
kamadak-exif = "0.6"
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }
log = "0.4.35"
psd = "0.3"
resvg = "0.49"
serde.workspace = true
sevenz-rust2 = "0.25"
thiserror.workspace = true
unrar = { version = "0.5", optional = true }
zip = { version = "9", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "zstd"] }

[features]
# Soporte para rar/cbr. UnRAR es freeware (no código abierto): quien necesite un paquete
# 100 % libre compila con --no-default-features.
default = ["rar"]
rar = ["dep:unrar"]

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
