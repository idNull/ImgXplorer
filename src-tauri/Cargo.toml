[package]
name = "imgxplorer"
description = "Visor de imágenes con Modo Acción"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "imgxplorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
imgx-audio.workspace = true
imgx-core.workspace = true
imgx-media.workspace = true
imgx-story.workspace = true
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native"] }
log = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
trash = "5.4.0"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[target."cfg(unix)".dependencies]
libc = "0.2"

[features]
# Soporte para rar/cbr con UnRAR (freeware, no código abierto). Para un paquete 100 % libre:
# cargo build --release -p imgxplorer --no-default-features
default = ["rar"]
rar = ["imgx-media/rar"]
